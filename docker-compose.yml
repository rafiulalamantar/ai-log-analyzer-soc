# The whole system in three containers. Ollama stays on the host by default:
# Docker on macOS cannot use the Apple GPU, so a containerised model is far slower.
#
#   docker compose up --build
#
# On a Linux machine with Ollama in Docker instead:
#   OLLAMA_HOST=http://ollama:11434 docker compose --profile ollama up --build

services:
  api:
    build: .
    image: ai-log-analyzer-soc
    environment:
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 5s
      timeout: 3s
      retries: 10

  dashboard:
    image: ai-log-analyzer-soc
    command: ["streamlit", "run", "dashboard/app.py", "--server.address=0.0.0.0", "--server.port=8501", "--server.headless=true"]
    environment:
      SOC_API: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy

  n8n:
    image: n8nio/n8n:2.42.7
    working_dir: /work
    # The workflow addresses the API as 127.0.0.1 for a native install; inside
    # Docker the API is the "api" service, so the address is swapped on import.
    entrypoint: ["sh", "-c"]
    command:
      - >
        sed 's#http://127.0.0.1:8000#http://api:8000#' n8n/soc_triage.json > /tmp/soc_triage.json &&
        n8n import:workflow --input=/tmp/soc_triage.json &&
        n8n publish:workflow --id=socTriage0000001 &&
        exec n8n start
    environment:
      N8N_RESTRICT_FILE_ACCESS_TO: /work/data/incidents
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
    volumes:
      - ./n8n:/work/n8n:ro
      - ./data/incidents:/work/data/incidents
      - n8n_data:/home/node/.n8n
    ports:
      - "5678:5678"
    depends_on:
      api:
        condition: service_healthy

  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"

volumes:
  n8n_data:
  ollama_data:
