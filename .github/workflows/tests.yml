# Runs the full test suite on every push to main and every pull request.
# The suite needs no Ollama and no network: the model is stubbed or replayed
# from recorded responses, and OLLAMA_HOST points at a closed port to prove it.
name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OLLAMA_HOST: http://localhost:9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest tests/ -q

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker build -t ai-log-analyzer-soc .
      - name: API container answers
        run: |
          docker run -d --name api -p 8000:8000 ai-log-analyzer-soc
          for i in $(seq 1 30); do curl -sf localhost:8000/ && exit 0; sleep 1; done
          docker logs api; exit 1
